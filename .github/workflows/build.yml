name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build game (Three.js bundle)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Dorifto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dorifto-apk
          path: Dorifto.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Dorifto.apk \
            --title "Dorifto v1.0.${{ github.run_number }}" \
            --notes "Завантаж Dorifto.apk на телефон і встанови."
